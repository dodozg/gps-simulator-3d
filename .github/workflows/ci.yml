name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (engine + web backend + pytest)
        # requirements-web povlači i FastAPI/httpx pa se web testovi (WebSocket,
        # REST, serijalizacija) STVARNO izvrše, a ne preskoče (importorskip).
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-web.txt

      - name: Run test suite
        run: pytest

  frontend:
    # TypeScript provjera + Vite build web sučelja (verzije iz package-lock.json).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck + build
        run: npm run build
